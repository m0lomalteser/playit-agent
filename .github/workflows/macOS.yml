name: Build macOS Silicon Release (Manuell & Unsigned)

on:
  workflow_dispatch: # Ermöglicht das manuelle Auslösen über die GitHub-Oberfläche

jobs:
  build_macos_silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release
        run: |
          cargo build --target aarch64-apple-darwin --release --all

      - name: Remove Signatures (Unsigned)
        run: |
          # Entfernt jegliche standardmäßige Code-Signatur von den erzeugten Binaries
          codesign --remove-signature "./target/aarch64-apple-darwin/release/playitd"
          codesign --remove-signature "./target/aarch64-apple-darwin/release/playit-cli"

      - name: Stage macOS release assets
        shell: bash
        run: |
          mkdir -p target/release-assets
          cp "./target/aarch64-apple-darwin/release/playitd" "target/release-assets/playit-macos-arm64"
          cp "./target/aarch64-apple-darwin/release/playit-cli" "target/release-assets/playit-cli-macos-arm64"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playit-macos-silicon-unsigned
          path: target/release-assets/*
